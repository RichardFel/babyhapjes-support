<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Babyhapjes · Papilu</title>
<meta name="description" content="Help, privacy policy and terms of use for Babyhapjes and Papilu.">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap">
<style>
:root{--bg:#FBF7EE;--surface:#FFFFFF;--ink:#2B2B2B;--muted:#5F6A58;--line:#DCE3D3;--brand:#4F7942;--brand-ink:#33502A;--accent:#E08A3C;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141912;--surface:#1D241A;--ink:#EDF1E8;--muted:#A2AE98;--line:#2D3828;--brand:#8DBB7C;--brand-ink:#B9D9AC;--accent:#F0A06A;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wrap{max-width:720px;margin:0 auto;padding-block:28px 64px}
header{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header img{width:56px;height:56px;border-radius:13px}
.brand{font:800 26px/1.1 Nunito,ui-rounded,system-ui,sans-serif;color:var(--brand-ink);text-decoration:none}
nav{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:18px;padding-bottom:14px;border-bottom:1px solid var(--line)}
nav a{color:var(--muted);text-decoration:none;font-weight:600;font-size:15px}
nav a[aria-current=page]{color:var(--brand-ink);text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:2px}
nav .langs{margin-left:auto;display:flex;gap:10px}
h1,h2,h3{font-family:Nunito,ui-rounded,system-ui,sans-serif;color:var(--brand-ink);line-height:1.2;text-wrap:balance}
h1{font-size:34px;font-weight:800;margin:28px 0 8px}
h2{font-size:22px;font-weight:800;margin:34px 0 8px}
h3{font-size:18px;font-weight:700;margin:22px 0 4px}
p{margin:0 0 10px}
.lead{color:var(--muted);font-size:17px}
.updated{color:var(--muted);font-size:14px}
ul{padding-left:22px;margin:0 0 10px}
a{color:var(--brand)}
.contact{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-top:10px}
.contact a{font-weight:700;word-break:break-all}
footer{margin-top:48px;color:var(--muted);font-size:14px}
.picker{display:grid;gap:12px;margin-top:24px}
.picker a{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;text-decoration:none;color:var(--ink);font-weight:600}
.picker a span{color:var(--muted);font-weight:400}
a:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap">
<header><img src="icon.png" alt=""><span class="brand">Babyhapjes · Papilu</span></header>
<main>
<h1>Help · Hulp · Ayuda · Ajuda</h1>
<p class="lead">Choose your language. Babyhapjes is the Dutch name of the app, Papilu the name in other languages.</p>
<nav class="picker" aria-label="Language">
<a href="nl/" lang="nl">Nederlands <span>Babyhapjes</span></a>
<a href="en/" lang="en">English <span>Papilu</span></a>
<a href="es/" lang="es">Español <span>Papilu</span></a>
<a href="pt/" lang="pt">Português <span>Papilu</span></a>
</nav>
</main>
</div>
</body>
</html>
